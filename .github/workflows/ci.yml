name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消尚未完成的旧运行，避免排队浪费。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # 原生 ARM64 runner 使用 /opt/homebrew；最低运行系统仍为 macOS 14。
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          swift --version
          xcodebuild -version

      # 本项目用 SwiftUI 的 `#Preview` 宏，它的宏插件只在完整 Xcode 里，
      # **Command Line Tools 里没有**。选错工具链时编译器只报
      # 「plugin for module 'PreviewsMacros' not found」——很难联想到工具链。
      #
      # 所以：复用项目自己的 swift-env.sh（它在检测到 CLT 时会切到完整 Xcode），
      # 把结果写进 GITHUB_ENV 让后续步骤也生效；仍然指向 CLT 就明确失败，
      # 而不是等构建时报那个难懂的错。
      - name: 选择工具链
        run: |
          source scripts/swift-env.sh
          if [ -n "${DEVELOPER_DIR:-}" ]; then
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
            echo "已把 DEVELOPER_DIR 设为 $DEVELOPER_DIR"
          fi
          if xcrun --find swift | grep -q CommandLineTools; then
            echo "::error::当前选中的是 Command Line Tools。本项目需要完整 Xcode（#Preview 宏插件）。"
            exit 1
          fi
          swift --version

      - name: 缓存 Homebrew 下载
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-httpd-php82

      # 配置生成相关的测试会真实调用 httpd 做语法检查，因此需要本机装有它们。
      # 这些公式是 bottled 的，安装很快。
      - name: 安装测试所需的组件
        run: brew install httpd php@8.2

      - name: 缓存构建产物
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: swift-${{ runner.os }}-

      - name: 构建
        run: swift build --build-tests

      # 只跑单元测试。真实启动 Apache/MariaDB 的验收套件（macstackctl 的十条命令）
      # 需要绑定端口并写用户目录，不在 CI 范围——那是发布前在本机跑的。
      - name: 单元测试
        run: swift test
