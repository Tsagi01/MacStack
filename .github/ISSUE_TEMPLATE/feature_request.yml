name: 功能建议
description: 提出一个改进或新功能
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        MacStack 的定位是**本机 PHP 开发环境**，主要面向课程作业与本地建站。
        与这个定位关系不大的建议（例如生产部署、集群、多用户）大概率不会被采纳，
        但欢迎提出来讨论。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请描述**场景**而不是直接给方案。你现在想做什么、卡在哪里？
      placeholder: |
        我想把一个已有的 Laravel 项目搬进来，但……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的其它办法
      description: 包括绕过去的方式——它们往往能说明真正需要的是什么。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过现有 issue，没有重复。
          required: true
